name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-01-lockfile:
    name: "Gate 01: lockfile in sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv lock --check

  gate-02-locked-install:
    name: "Gate 02: install from lockfile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked

  gate-03-lint:
    name: "Gate 03: lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run ruff check .

  gate-04-format:
    name: "Gate 04: format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run ruff format --check .

  gate-05-type-check:
    name: "Gate 05: type check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - name: Run mypy on tracked Python files
        run: |
          mapfile -t files < <(git ls-files -co --exclude-standard -- '*.py')
          uv run mypy "${files[@]}"

  gate-06-tests:
    name: "Gate 06: tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: amigoact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d amigoact_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Check for test files
        id: detect
        run: |
          if git ls-files -co --exclude-standard | grep -qE '(^|/)(test_[^/]*|[^/]*_test)\.py$|(^|/)tests/'; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test files yet; skipping pytest."
          fi
      - if: steps.detect.outputs.has_tests == 'true'
        run: uv sync --locked
      - name: Write .env with the CI database URL and throwaway secrets
        if: steps.detect.outputs.has_tests == 'true'
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          printf 'DATABASE_URL=postgresql+psycopg://ci:%s@localhost:5432/amigoact_test\n' "$CI_POSTGRES_PASSWORD" > .env
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'CHAT_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
      - name: Load schema.sql into the CI database
        if: steps.detect.outputs.has_tests == 'true'
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: psql -h localhost -U ci -d amigoact_test -v ON_ERROR_STOP=1 -f schema.sql
      - if: steps.detect.outputs.has_tests == 'true'
        run: uv run pytest

  gate-07-file-length:
    name: "Gate 07: .py files at most 350 lines"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check line counts
        run: |
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 350 ]; then
              echo "::error file=$file::$lines lines; the limit for .py files is 350"
              status=1
            fi
          done < <(git ls-files -co --exclude-standard -- '*.py')
          exit $status

  gate-08-english-only:
    name: "Gate 08: English only in code, config, and SQL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-ASCII characters
        run: |
          mapfile -t files < <(git ls-files -co --exclude-standard -- '*.py' '*.toml' '*.yml' '*.yaml' '*.sql' ':!schema.sql')
          if [ "${#files[@]}" -gt 0 ] && grep -nP '[^\x00-\x7F]' "${files[@]}"; then
            echo "::error::Non-ASCII characters found. Code, config, and SQL must be in English."
            exit 1
          fi

  gate-09-smoke-run:
    name: "Gate 09: smoke run"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run main.py

  gate-10-no-junk-files:
    name: "Gate 10: no junk files tracked"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject junk files
        run: |
          junk=$(git ls-files -co --exclude-standard \
            | grep -E '(^|/)(\.venv|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)/|\.pyc$|(^|/)\.env(\..+)?$|\.log$|(^|/)\.DS_Store$|(^|/)Thumbs\.db$|\.tmp$|\.bak$' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$junk" ]; then
            echo "$junk"
            echo "::error::Junk files are tracked. Remove them from the repository."
            exit 1
          fi

  gate-11-secret-scan:
    name: "Gate 11: secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate-12-workflow-lint:
    name: "Gate 12: workflow lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7

  gate-13-endpoint-tests:
    name: "Gate 13: every endpoint has tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that each route path is referenced by a test
        run: |
          mapfile -t sources < <(git ls-files -co --exclude-standard -- '*.py' ':!tests')
          mapfile -t tests < <(git ls-files -co --exclude-standard -- tests | grep '\.py$')
          routes=()
          if [ "${#sources[@]}" -gt 0 ]; then
            mapfile -t routes < <(grep -hoP '@\w+\.(get|post|put|patch|delete)\(\s*"\K[^"]+' "${sources[@]}" | sort -u)
          fi
          status=0
          for route in "${routes[@]}"; do
            # Match on the static part of the path, e.g. "/events/" for "/events/{event_id}"
            prefix="${route%%\{*}"
            if [ "${#tests[@]}" -eq 0 ] || ! grep -qF "$prefix" "${tests[@]}"; then
              echo "::error::Endpoint '$route' has no test under tests/ that references '$prefix'"
              status=1
            fi
          done
          exit $status
